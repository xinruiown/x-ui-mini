name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "tag like v0.1.0"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Test
        run: go test ./...
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VER="${GITHUB_REF_NAME:-v0.0.0}"
          VER="${VER#v}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/xinruiown/x-ui-mini/internal/version.Version=${VER} -X github.com/xinruiown/x-ui-mini/internal/version.Commit=${GITHUB_SHA}" -o dist/x-ui-mini ./cmd/x-ui-mini
          cp contrib/x-ui-mini.service dist/
          tar -C dist -czf "x-ui-mini_${VER}_linux_${GOARCH}.tar.gz" x-ui-mini x-ui-mini.service
          sha256sum "x-ui-mini_${VER}_linux_${GOARCH}.tar.gz" > "x-ui-mini_${VER}_linux_${GOARCH}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goarch }}
          path: |
            x-ui-mini_*.tar.gz
            x-ui-mini_*.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            x-ui-mini_*.tar.gz
            x-ui-mini_*.sha256
